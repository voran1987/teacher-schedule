function groupName(raw,uni){let s=String(raw||'').trim();if(/^Магистратура, 2 курс · Комиссия/i.test(s))return 'Магистратура, 2 курс · комиссия';if(/^Бакалавриат,\s*\d+\s*курс(?:,\s*\d+\s*группа)?\s*·\s*комиссия$/i.test(s))return s.replace(/комиссия$/i,'комиссия');if(uni==='ГУУ'){s=s.replace(/^ИГУиП\s*·\s*(?:магистратура|бакалавриат),\s*\d+\s*курс\s*·\s*/i,'').replace(/^((?:Магистратура|Бакалавриат),\s*\d+\s*курс)\s*·\s*(?=.+)/i,'').replace(/,\s*гр\.\s*(\d+)$/i,', $1')}return s||'Группа не указана'}
const scheduleSeed=[["ГУУ","Основы российской государственности","Продвижение нового бизнеса, 1"],["ГУУ","Основы российской государственности","Общий поток: ЦМК 1, 2; Реклама и цифровой дизайн 1; Продвижение нового бизнеса 1"],["ГУУ","Основы российской государственности","Реклама и цифровой дизайн, 1"],["ГУУ","Техника и технологии СМИ","ИГУиП · магистратура, 1 курс · Политический менеджмент и связи с общественностью, гр. 1"],["ГУУ","Современные технологии в политическом консалтинге","ИГУиП · магистратура, 1 курс · Политический менеджмент и связи с общественностью, гр. 1"],["ГУУ","Мировая политика и международные отношения","ИГУиП · бакалавриат, 3 курс · Государственная политика и политическое управление, гр. 1"],["ГУУ","Сравнительная политология","ИГУиП · бакалавриат, 3 курс · Государственная политика и политическое управление, гр. 1"],["ГАУГН","Политическая конфликтология","Политология, 4 курс"],["МЭИ","Правоведение","А-14-24"],["МЭИ","Политология","А-5,13,14,16,18,19,22-25"],["МЭИ","Правоведение","А-1,2,3,5,13,14,16,19-24"],["МЭИ","Политология","А-05-25"],["МЭИ","Основы российской государственности","ГПоз-01-26"],["МЭИ","Основы российской государственности","Э-02-26"],["МЭИ","Основы российской государственности","ИЭ-03-26"],["МЭИ","Основы российской государственности","ИЭ-21-26"],["МЭИ","Политология","А-13-25"],["ГУУ","Проектная работа","Бакалавриат, 1 курс, 2 группа · комиссия"],["ГУУ","Проектная работа","Бакалавриат, 2 курс · комиссия"],["ГУУ","Проектная работа","Бакалавриат, 3 курс · комиссия"],["ГУУ","Практика","Магистратура, 2 курс · Комиссия · окончание не указано"],["ГУУ","Техника и технологии СМИ","Магистратура, 1 курс · Политический менеджмент и связи с общественностью, гр. 1"],["ГУУ","Современные технологии в политическом консалтинге","Магистратура, 1 курс · Политический менеджмент и связи с общественностью, гр. 1"],["ГУУ","Сравнительная политология","Бакалавриат, 3 курс · Государственная политика и политическое управление, гр. 1"],["ГУУ","Основы российс function catalogEntries(rows){let result=[];for(const row of rows){if(!Array.isArray(row)||row.length!==3||!['МЭИ','ГУУ','ГАУГН'].includes(row[0])||typeof row[1]!=='string'||typeof row[2]!=='string')continue;let [uni,subject,raw]=row;let name=groupName(raw,uni);if(!subject.trim()||!raw.trim())continue;result.push({uni,subject,name,kind:/комиссия/i.test(name)?'commission':/^Общий поток:|^А-\d+,/i.test(name)?'stream':'group'});if(uni==='ГУУ'&&/^Общий поток:/i.test(name)){for(const part of name.replace(/^Общий поток:\s*/i,'').split(';')){const m=part.trim().match(/^(.+?)\s+(\d+(?:\s*,\s*\d+)*)$/);if(m)for(const n of m[2].split(','))result.push({uni,subject,name:m[1].trim()+', '+n.trim(),kind:'group'})}}}return [...new Map(result.map(r=>[JSON.stringify([r.uni,normalize(r.subject),normalize(r.name)]),r])).values()]}
function importScheduleCatalog(rows){let added=0,changed=false;for(const r of catalogEntries(rows)){if(!db.unis.includes(r.uni)){db.unis.push(r.uni);changed=true}let c=db.courses.find(x=>x.uni===r.uni&&normalize(x.name)===normalize(r.subject));if(!c){c={id:uid(),uni:r.uni,name:r.subject};db.courses.push(c);changed=true}let key=JSON.stringify([r.uni,normalize(r.subject),normalize(r.name)]);let g=db.groups.find(x=>x.course===c.id&&(x.scheduleKey===key||normalize(groupName(x.name,r.uni))===normalize(r.name)||(r.kind==='commission'&&r.name==='Магистратура, 2 курс · комиссия'&&normalize(x.name)==='комиссия · окончание не указано')));if(!g){g={id:uid(),course:c.id,name:r.name};db.groups.push(g);added++;changed=true}if(g.scheduleKey!==key||g.scheduleKind!==r.kind){g.scheduleKey=key;g.scheduleKind=r.kind;changed=true}}
if(changed)save();return added}
function syncScheduleCatalog(manual=false){if(location.protocol==='file:'){if(manual)notify('Использован встроенный список расписания');return}const frame=document.createElement('iframe');frame.hidden=true;frame.title='Синхронизация расписания';let done=false;function finish(ok){if(done)return;done=true;clearTimeout(timer);frame.remove();if(manual&&!ok)notify('Расписание недоступно; сохранён предыдущий список')}const timer=setTimeout(()=>finish(false),12000);frame.onload=()=>{try{let rows=frame.contentWindow.academiaCatalog();if(!Array.isArray(rows)||!rows.length)throw Error();let added=importScheduleCatalog(rows);finish(true);if(manual||added){render();notify(added?'Добавлено групп: '+added:'Список групп актуален')}}catch{finish(false)}};frame.onerror=()=>finish(false);frame.src='./index.html?academiaSync=1&v='+Date.now();document.body.appendChild(frame)}
function groupDirectory(){return panel('Группы по дисциплине',groups().slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(g=>'<div class="entry"><div><strong>'+esc(g.name)+'</strong><p>'+ (g.scheduleKind==='stream'?'Лекционный поток · ':g.scheduleKind==='commission'?'Комиссия · ':g.scheduleKey?'Из расписания · ':'')+list('students').filter(s=>s.group===g.id).length+' студентов</p></div>'+btn('Открыть',"group='"+g.id+"';render()",'small'+(group===g.id?' primary':''))+'</div>').join('')||empty('Групп пока нет.'))}
function renderScheduleContext(){const el=$('#scheduleContext');const s=scheduleContext;if(!s||s.course!==activeCourse){el.hidden=true;el.textContent='';return}el.hidden=false;el.innerHTML='<div class="notice" style="margin-top:16px"><strong>Из расписания · '+esc(s.type)+'</strong><br>'+esc(fmt(s.date))+' · '+esc(s.time)+' · '+esc(gname(s.group))+(s.room?' · ауд. '+esc(s.room):'')+'<div class="actions" style="margin-top:9px">'+btn('Посещаемость','openLinkedSession()','small')+btn('Журнал','openLinkedPage(\'grades\')','small')+btn('Тесты','openLinkedPage(\'tests\')','small')+btn('Экзамены','openLinkedPage(\'exam\')','small')+'</div></div>'}

function loadScheduleContext(){const q=new URLSearchParams(location.search);if(q.get('from')!=='schedule')return;const read=(k,n=250)=>(q.get(k)||'').trim().slice(0,n);let uni=read('uni',20),subject=read('subject'),raw=read('group',500),day=read('date',10),time=read('time',50),type=read('type',50),room=read('room',100);if(!['МЭИ','ГУУ','ГАУГН'].includes(uni)||!subject||!/^\d{4}-\d{2}-\d{2}$/.test(day)||Number.isNaN(Date.parse(day)))return;let back=new URL('./',location.href);let week=read('week',2);if(/^\d{1,2}$/.test(week)&&+week>=1&&+week<=17)back.searchParams.set('week',week);if(q.get('view')==='session')back.searchParams.set('view','session');$('#scheduleBack').href=back.href;if(!db.unis.includes(uni))db.unis.push(uni);let c=db.courses.find(x=>x.uni===uni&&normalize(x.name)===normalize(subject));if(!c){c={id:uid(),uni,name:subject};db.courses.push(c)}let name=groupName(raw,uni);let catalogKey=JSON.stringify([uni,normalize(subject),normalize(name)]);let g=db.groups.find(x=>x.course===c.id&&(x.scheduleKey===catalogKey||normalize(groupName(x.name,uni))===normalize(name)));if(!g){g={id:uid(),course:c.id,name};db.groups.push(g)}let key=JSON.stringify([c.id,g.id,day,time,type]);let s=db.sessions.find(x=>x.scheduleKey===key);if(!s){s={id:uid(),course:c.id,group:g.id,title:type||subject,date:day,type:type||'Занятие',time,room,marks:{},scheduleKey:key};db.sessions.push(s)}else{s.room=room}
activeUni=uni;activeCourse=c.id;group=g.id;selectedSession=s.id;scheduleContext=s;page=/Экзамен|Зач[её]т/i.test(type)?'exam':'attendance';save()}
importScheduleCatalog(scheduleSeed);loadScheduleContext();render();syncScheduleCatalog();</script></body></html>
