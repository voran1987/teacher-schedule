function spGradePlan(data){const ctx=spGradeContext();if(!ctx)throw Error('Группа СП не найдена');if(data.format!=='academia-sp-grades-v1'||data.assignmentKey!==spAssignmentKey||data.uni!=='ГУУ'||data.course!=='Сравнительная политология'||data.assignment!==spAssignmentTitle||normalize(data.group)!==normalize('Государственная политика и политическое управление, 1')||!Array.isArray(data.grades)||data.grades.length!==16)throw Error('Некорректный пакет оценок');let additions=[],missing=[],existing=0,seen=new Set();for(const r of data.grades){if(typeof r.name!=='string'||!Number.isInteger(r.points)||r.points<0||r.points>10||typeof r.note!=='string'||r.note.length>1000||seen.has(spNameKey(r.name)))throw Error('Некорректная оценка');seen.add(spNameKey(r.name));const matches=db.students.filter(st=>st.course===ctx.c.id&&st.group===ctx.g.id&&!st.excluded&&spNameKey(st.name)===spNameKey(r.name));if(matches.length!==1){missing.push(r.name);continue}const st=matches[0];if(db.grades.some(g=>g.course===ctx.c.id&&g.student===st.id&&(g.assignmentKey===spAssignmentKey||normalize(g.title)===normalize(spAssignmentTitle)))){existing++;continue}additions.push({id:uid(),course:ctx.c.id,student:st.id,title:spAssignmentTitle,points:r.points,date:'2026-11-28',assignmentKey:spAssignmentKey,maxPoints:10,note:r.note})}return {ctx,additions,missing,existing}}

function migrateStudentNames(){const buckets=new Map();for(const st of db.students){const key=JSON.stringify([st.course,st.group,studentNameKey(st.name)]);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(st)}let changed=0;const dropped=new Set();for(const arr of buckets.values()){if(!arr.some(st=>/\(\s*ИИ\s*\)\s*$/iu.test(st.name)))continue;const keep=arr.find(st=>!st.excluded&&st.name===cleanStudentName(st.name))||arr.find(st=>!st.excluded)||arr[0];const name=cleanStudentName(keep.name);if(keep.name!==name){keep.name=name;changed++}for(const st of arr){if(st===keep)continue;for(const session of db.sessions){if(session.course!==keep.course||session.group!==keep.group)continue;for(const key of ['marks','sourceNotes']){const values=session[key];if(!values||!Object.prototype.hasOwnProperty.call(values,st.id))continue;if(!Object.prototype.hasOwnProperty.call(values,keep.id)||!values[keep.id])values[keep.id]=values[st.id];else if(values[keep.id]!==values[st.id]){session.mergedStudentHistory??=[];session.mergedStudentHistory.push({student:keep.id,field:key,previous:values[st.id],retained:values[keep.id]});}delete values[st.id]}}for(const rows of [db.grades,db.attempts])for(const row of rows)if(row.student===st.id)row.student=keep.id;dropped.add(st.id);changed++}}if(dropped.size)db.students=db.students.filter(st=>!dropped.has(st.id));if(changed)save();return changed}
function groupName(raw,uni){let s=String(raw||'').trim();if(/^Магистратура, 2 курс · Комиссия/i.test(s))return 'Магистратура, 2 курс · комиссия';if(/^Бакалавриат,\s*\d+\s*курс(?:,\s*\d+\s*группа)?\s*·\s*комиссия$/i.test(s))return s.replace(/комиссия$/i,'комиссия');if(uni==='ГУУ'){s=s.replace(/^ИГУиП\s*·\s*(?:магистратура|бакалавриат),\s*\d+\s*курс\s*·\s*/i,'').replace(/^((?:Магистратура|Бакалавриат),\s*\d+\s*курс)\s*·\s*(?=.+)/i,'').replace(/,\s*гр\.\s*(\d+)$/i,', $1')}return s||'Группа не указана'}

function catalogEntries(rows){let result=[];for(const row of rows){if(!Array.isArray(row)||row.length!==3||!['МЭИ','ГУУ','ГАУГН'].includes(row[0])||typeof row[1]!=='string'||typeof row[2]!=='string')continue;let [uni,subject,raw]=row;let name=groupName(raw,uni);if(!subject.trim()||!raw.trim())continue;result.push({uni,subject,name,kind:/комиссия/i.test(name)?'commission':/^Общий поток:|^А-\d+,/i.test(name)?'stream':'group'});if(uni==='ГУУ'&&/^Общий поток:/i.test(name)){for(const part of name.replace(/^Общий поток:\s*/i,'').split(';')){const m=part.trim().match(/^(.+?)\s+(\d+(?:\s*,\s*\d+)*)$/);if(m)for(const n of m[2].split(','))result.push({uni,subject,name:m[1].trim()+', '+n.trim(),kind:'group'})}}}return [...new Map(result.map(r=>[JSON.stringify([r.uni,normalize(r.subject),normalize(r.name)]),r])).values()]}
